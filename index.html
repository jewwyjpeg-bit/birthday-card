<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">

<canvas id="confetti-canvas"></canvas>

<div class="card">
  <div class="card-inner">
    <div class="card-front">
      <div class="polaroid">
        <img src="https://i.imgur.com/uCSN2Oh.png" alt="Front Photo">
        <p class="caption">Happy 18th</p>
      </div>
    </div>

    <div class="card-inside">
      <div class="inside-content" onclick="event.stopPropagation()">
        <h1>Happy 18th Birthday 💛</h1>
        <p>I can’t believe we’ve been friends since freshman year.<br>Thank you for all the laughs, memories, and chaos —<br>I’m so lucky to have you!</p>
        <img src="https://i.imgur.com/aXRKTJ1.png" alt="Inside photo" class="inside-photo">
        <p class="signature">Love, Jerry</p>

        <button id="playPauseBtn">▶ Play</button>

        <div class="music-bars">
          <!-- 20 bars -->
          ${Array(20).fill('<div class="bar"></div>').join('')}
        </div>
      </div>
    </div>
  </div>
</div>
<script src="./script.js" defer></script>
